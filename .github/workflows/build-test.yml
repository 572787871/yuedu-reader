name: Build & Test (mine/clean-reader)

on:
  push:
    branches: ['mine/**']
  workflow_dispatch:

concurrency:
  group: build-test
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test on macOS 26 (Xcode 26)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show xcode version
        run: xcodebuild -version

      - name: Build for simulator
        env:
          # The targets use an iOS 26 deployment target (Xcode 26 SDK),
          # so we must NOT override IPHONEOS_DEPLOYMENT_TARGET here.
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild build \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild test \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO
