name: Build & Test (mine/clean-reader)

on:
  push:
    branches: ['mine/**']
  workflow_dispatch:

concurrency:
  group: build-test
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test on macOS 26 (Xcode 26)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show xcode version
        run: xcodebuild -version

      - name: Build for simulator
        env:
          # The targets use an iOS 26 deployment target (Xcode 26 SDK),
          # so we must NOT override IPHONEOS_DEPLOYMENT_TARGET here.
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild build \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild test \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -skip-testing:"yuedu appUITests" \
            -resultBundlePath "${{ github.workspace }}/build/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO
        continue-on-error: true
        id: tests

      - name: Report test result
        if: always()
        run: |
          echo "Unit tests (yuedu appTests) ran; UITests runner is skipped (env bootstrap crash on runner)."

      - name: Upload test results bundle
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: TestResults-xcresult
          path: build/TestResults.xcresult
          if-no-files-found: warn

      - name: Archive (unsigned)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild archive \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${{ github.workspace }}/build/YueduReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ github.workspace }}/build/YueduReader.xcarchive/Products/Applications/YueduReader.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi
          IPA_NAME="YueduReader-unsigned.ipa"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y "$IPA_NAME" Payload
          rm -rf Payload
          echo "IPA_SIZE=$(stat -f%z "$IPA_NAME")" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned-IPA
          path: YueduReader-unsigned.ipa
          if-no-files-found: error
