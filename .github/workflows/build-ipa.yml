name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ['build/**', 'mine/**']

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show xcode version
        run: xcodebuild -version

      - name: Generate placeholder GoogleService-Info.plist
        run: |
          cat > GoogleService-Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>placeholder</string>
            <key>GCM_SENDER_ID</key>
            <string>placeholder</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.zhangruilin.yuedureader</string>
            <key>PROJECT_ID</key>
            <string>placeholder</string>
            <key>STORAGE_BUCKET</key>
            <string>placeholder</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:placeholder:ios:placeholder</string>
          </dict>
          </plist>
          PLIST
          echo "Generated placeholder GoogleService-Info.plist"

      - name: Archive (unsigned)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild archive \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${{ github.workspace }}/build/YueduReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ github.workspace }}/build/YueduReader.xcarchive/Products/Applications/YueduReader.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi
          IPA_NAME="YueduReader-unsigned.ipa"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Remove extensions to prevent app extension signature validation failures on re-sign
          rm -rf Payload/YueduReader.app/PlugIns

          zip -r -y "$IPA_NAME" Payload
          rm -rf Payload
          echo "IPA_SIZE=$(stat -f%z "$IPA_NAME")" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned-IPA
          path: YueduReader-unsigned.ipa
          if-no-files-found: error
