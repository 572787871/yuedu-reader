name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ['build/**', 'mine/**']

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: ""
        run: |
          xcodebuild archive \
            -project Yuedu-Reader.xcodeproj \
            -scheme Yuedu-Reader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${{ github.workspace }}/build/YueduReader.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ github.workspace }}/build/YueduReader.xcarchive/Products/Applications/YueduReader.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH"
            exit 1
          fi
          IPA_NAME="YueduReader-unsigned.ipa"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y "$IPA_NAME" Payload
          rm -rf Payload
          echo "IPA_SIZE=$(stat -f%z "$IPA_NAME")" >> "$GITHUB_ENV"
          ls -lh "$IPA_NAME"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned-IPA
          path: YueduReader-unsigned.ipa
          if-no-files-found: error
